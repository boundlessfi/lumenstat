name: site

# Checks for the lumenstat.com landing page (apps/site). Nothing here deploys.
on:
  pull_request:
    paths:
      - 'apps/site/**'
      - 'packages/tracker/releases.json'
      - '.github/workflows/site.yml'
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'packages/tracker/releases.json'
      - '.github/workflows/site.yml'

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/site

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - run: npm ci

      # Static checks
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # After the build: next-env.d.ts is generated by it.
      - run: npm run typecheck
      - run: npm run lint:copy
      - name: Bundle budget
        run: npm run check:bundle | tee bundle-report.txt

      # Browser checks
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e

      # Release checks
      - name: Lighthouse budgets
        run: npm run lhci

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: site-reports
          if-no-files-found: ignore
          path: |
            apps/site/bundle-report.txt
            apps/site/playwright-report
            apps/site/test-results
            apps/site/.lighthouseci

  # External links can fail for reasons outside this repo, so this job never blocks.
  external-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium -g "external links"
        env:
          CHECK_EXTERNAL: '1'
